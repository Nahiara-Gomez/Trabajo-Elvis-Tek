<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <script src="assets/JS/botonSubir.js" defer></script>

</head>
        
<body>
    <header>
        <button onclick="subir()" class="botonSubir">▲</button>
        <h1>Todo en blanco</h1>
        <img class="logo" src="assets/img/Airbrush-IMAGE-ENHANCER-1777983628316-1777983628316-removebg-preview.png"
        alt="futuro logo">
         <button id="btnMenu" aria-label="Toggle menu">&#9776;</button>
        <nav>
            <ul class="menu_principal">
                <li><a href="index.html" class="BotonNavegacion">Pagina principal</a></li>
                <li><a href="Contacto.html" class="BotonNavegacion">Contáctanos</a></li>
                <li><a href="sobre_nosotros.html" class="BotonNavegacion">sobre nosotros</a></li>
                <li><a href="Ingreso_empleados.html" class="BotonNavegacion">Empleados</a></li>
                <li><a href="formulario.html" class="BotonNavegacion">Trabaja con nosotros</a></li>
            </ul>
        </nav>
        <script src="assets/JS/script.js"></script>
    </header>

    <main>
        <section class="Formulario">
            <form action="Empleados.html">
                <fieldset>
                    <legend>Ingreso</legend>
                    <ul>
                        <li>
                            <label for="CI">Cedula de identidad</label>
                            <input type="text" id="CI" name="CI_empleado" pattern="[1-9]+" title="Sin puntos ni guiones" maxlength="8"
                                required placeholder="Escribe tu cedula aqui" />
                        </li>
                        <li>
                            <label for="Contraseña">Contraseña</label>
                            <input type="password" id="Contraseña" name="Contraseña_empleado" required
                                placeholder="Ingrese su contraseña aqui" />
                        </li>
                        <li>
                            <button type="submit">Ingresar </button>
                        </li>
                    </ul>    
                </fieldset>
            </form>
        </section>
    </main>
</body>

</html>
