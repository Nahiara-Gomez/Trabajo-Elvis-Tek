<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/empleados.css">
</head>

<body>

    <h1>Empleados</h1>

    <button id="btnAltaUsuario">Agregar</button>

    <section class="formularioAltaUsuario">

        <form>

            <h2>Alta de empleado</h2>

        <label for="cedula">Cédula</label>
        <input type="text" id="cedula" maxlength="8">

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre">

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido">

        <label for="cargo">Cargo</label>
        <input type="text" id="cargo">

            <button type="button" id="btnGuardarUsuario">Guardar</button>
            <button type="button" id="btnCerrarAltaUsuario">Cerrar</button>

        </form>

    </section>

    <table border="1" id="tabla">

        <tr>
            <th>Cédula</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Cargo</th>
            <th>Acciones</th>
        </tr>

        <tr>
            <td>12345678</td>
            <td>Juan</td>
            <td>Pérez</td>
            <td>Vendedor</td>
            <td>
                <button onclick="modificar(this)">Modificar</button>
                <button onclick="borrar(this)">Eliminar</button>
            </td>
        </tr>

    </table>

    <script src="assets/JS/tablaEmpleados.js"></script>
</body>

</html>
