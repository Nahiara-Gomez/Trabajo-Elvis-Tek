<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de Postulación</title>
    <link rel="stylesheet" href="styles.css">
</head>
<nav>
    <ul class="menu_principal">
        <li><a href="index.html">Pagina principal</a></li>
        <li><a href="Contacto.html">Contáctanos</a></li>
        <li><a href="sobre_nosotros.html">sobre nosotros</a></li>
        <li><a href="Ingreso_empleados.html">Empleados</a></li>
        <li><a href="formulario.html">Trabaja con nosotros</a></li>
    </ul>
</nav>

<body>

    <h1>Postulación a la empresa</h1>

    <p>Requisitos para la postulación</p>
    
    <ul>
        <li>
            Ser mayor de edad
        </li>
        <li>
            Tener estudios previos
        </li>
        <li>
            Se valorará contar con referencias laborales
        </li>

    </ul>
    <br>

    <form action="#" method="post" enctype="multipart/form-data"
        onsubmit="return confirm('¿Desea enviar la solicitud de trabajo?')">


        <!-- Correo -->
        <label for="correo">Ingrese su correo electrónico:</label><br>
        <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com"><br><br>

        <!-- Texto libre -->
        <label for="mensaje">Contanos sobre vos:</label><br>
        <textarea id="mensaje" name="mensaje" required
            placeholder="Escribí acá tu experiencia, motivación, etc..."></textarea><br><br>

        <!-- Subir CV -->
        <label for="cv">Adjuntar Curriculum:</label><br>
        <input type="file" id="cv" required name="cv"><br><br>

        <!-- Checkbox -->
        <input type="checkbox" id="acepto" required name="acepto">
        <label for="acepto">
            Acepto ser contratado en Todo en Blanco
        </label><br><br>

        <!-- Botón -->
        <button type="submit">Enviar formulario</button>

    </form>

</body>

</html>
