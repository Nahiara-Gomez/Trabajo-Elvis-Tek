<body>
    <h3>
        <p><b>Para consultas de presupuesto y disponibilidad contactenos por:</b></p>
    </h3>
    <p>Mail: clientestodoenblanco@gmail.com</p>
    <p>Numero telefonico: 4567 7373</p>
    <p>Numero de Whatsapp: +598 9532 4444</p>

    <h4>Para consultas especificas:</h4>

    <form>
        <ul>
        <li>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre_cliente" required placeholder="Escribe tu nombre aqui" />
        </li>
        <li>
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido_cliente" required placeholder="Ingrese su apellido aqui" />
        </li>
        <li>
            <label for="telefono">Numero de telefono</label>
            <input type="tel" id="telefono" name="telefono_cliente" maxlength="9" pattern="[0-9]+" title="Ingrese solo numeros"
                maxlength="9" placeholder="Ingrese su numero de telefono" />
        </li>
        <li>
            <label for="correo">Correo electronico</label>
            <input type="email" id="correo" name="correo_cliente" required
                placeholder="Ingrese aqui su correo electronico" />
        </li>
        <li>
            <label for="tipo_consultas">Tipo de consulta</label>
            <select name="lista" id="tipo_consultas">
                <option value="catalogo">Catalogo</option>
                <option value="repuesto">Repuesto</option>
                <option value="desperfecto">Desperfecto</option>
            </select>
        </li>
        <li>
            <label for="descripcion">Describe que precisas:</label>
            <textarea id="descripcion" name="descripcion" rows="10" cols="50" required
                placeholder="Escribe aquí"></textarea>
        </li>
        <li>
            <label>
              <input type="checkbox" required>
               Confirmo que quiero enviar el formulario
            </label>
            
        </li>
        <li>
            <input type="submit" value="Enviar">
        </li>
        </ul>  
    </form>

</body>

</html>
